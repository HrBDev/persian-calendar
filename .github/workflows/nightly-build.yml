name: Nightly Build

on:
  workflow_dispatch: # To run the workflow manually if needed
  schedule:
    - cron: '22 8 * * *' # one a day

permissions:
  contents: read

jobs:
  evaluateChanges:
    name: Evaluate changes for run or skipping nightly build
    runs-on: ubuntu-latest
    outputs:
      SHOULD_BUILD: ${{ steps.check.outputs.shouldBuild }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Check
        id: check
        run: |
          if [[ $(git rev-list --after="24 hours" main) ]]; then
            echo shouldBuild=true >> $GITHUB_OUTPUT
          else
            echo shouldBuild=false >> $GITHUB_OUTPUT
          fi

  build:
    name: Generate Nightly Build
    runs-on: ubuntu-latest
    needs: evaluateChanges
    if: ${{ needs.evaluateChanges.outputs.SHOULD_BUILD == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Build and send apks to telegram
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          ./gradlew assembleNightly
          apk_path="$(find . -type f -iname *.apk)"
          jq -nr --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg size "$(du -h --apparent-size "$apk_path" | cut -f1)" '
            def escaped($n):
              if length > $n then .[:($n - 1)] + "…" else . end | @html;
            def link($url; $label): "<a href=\"" + ($url | @html) + "\">" + $label + "</a>";
            ("https://github.com/" + $repository) as $base |
            ("<b>📦 Persian Calendar · Nightly APK</b>\n<i>Development build</i>\n\n" +
              "<b>Branch:</b> <code>" + ($ref | escaped(80)) + "</code>\n" +
              "<b>Commit:</b> " + link($base + "/commit/" + ($sha | @uri); ($sha[:8] | @html)) +
              "\n<b>Size:</b> " + ($size | escaped(20)) + "\n\n" +
              link($base + "/actions/runs/" + ($run | @uri); "Build details") +
              " · @Persian_Calendar") |
            # Raw UTF-8 bytes conservatively bound the parsed caption length.
            if utf8bytelength <= 1024 then . else
              "<b>📦 Persian Calendar · Nightly APK</b>\nSize: " + ($size | escaped(20)) +
              "\nCommit: <code>" + ($sha[:8] | @html) + "</code>\n@Persian_Calendar"
            end
          ' > "$RUNNER_TEMP/telegram-caption.html"
          curl --fail --silent --show-error \
            "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
            --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            -F "caption=<$RUNNER_TEMP/telegram-caption.html" \
            --form-string parse_mode=HTML \
            -F document=@"$apk_path" |
            jq -e '.ok == true' > /dev/null
          rm "$apk_path"

  update-report:
    name: Update the runtime dependencies report
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/update-dependencies-report.yml
    with:
      ref: ${{ github.ref_name }}
